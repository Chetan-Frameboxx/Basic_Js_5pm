<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Method In JS</title>
</head>
<body>
    <h1>String Method In JS</h1>



    <script>
        // String Method In JS

        let  a = "Namaste";
        let c = "           hello         "
        let b = "Namaste India Mata"

        console.log(a.toUpperCase());
        console.log(a.toLowerCase());
        console.log(a.concat(" Bharat"));
        console.log(a.length);

        console.log(b);
        console.log(b.indexOf('a'));
        console.log(b.lastIndexOf('a'));


        console.log(c);
        console.log(c.length);
        console.log(c.trim());
        console.log(c.trim().length);
        


        console.log(b);
        console.log(b.replace("India", "Bharat"));


        let str = "Hello, I'm Rohan."
        console.log(str);
        // console.log(str.slice(0,4));
        // console.log(str.substr(0,4));
        console.log(str.substring(0,4));
        console.log(str);

        console.log(str.split(','));
        
        
        
        
        
        



    </script>
</body>
</html>
