<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Method In JS</title>
</head>
<body>
    <h1>Number Method In JS</h1>



    <script>
        // Number Method In JS


        let a = 4.6;
        let b = 5.45145454121;

        console.log(a);
        console.log(typeof a);
        console.log(Number.isFinite(a));
        console.log(Number.isInteger(4));
        console.log(Number.isNaN(NaN));
        console.log(parseInt(a));
        console.log(parseFloat(b));
        console.log(b.toFixed(2));
        console.log(typeof b.toFixed(2));
        let strNum = a.toString()
        console.log(strNum);
        console.log(typeof parseFloat(strNum));
        
        
        
        
        
        


    </script>
</body>
</html>
