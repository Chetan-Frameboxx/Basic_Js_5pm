<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function In JS</title>
  </head>
  <body>
    <h1>Function In JS</h1>

    <p>
      Function is a block of code that perform Particular task and provide
      Reusability
    </p>
    <p>Function's are the Heart of JavaScript</p>
    <p>Function Declration are Hoisted but function Expression are not Hoisted.</p>

    <script>
      // Function Declration
      greet();

      function greet() {
        console.log("Good Morning");
      }

      // Function Calling

    //   greet();
    //   greet();
    //   greet();
    //   greet();
    //   greet();
    //   greet();




    //   function Expression / Anonymous Function

    // myGreet()

    const myGreet = function() {
        console.log("Namaste");
    }


    // function Expression calling 

    myGreet()
    </script>
  </body>
</html>
