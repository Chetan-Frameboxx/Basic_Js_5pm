<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array In Js</title>
</head>
<body>
    <h1>Array In Js</h1>



    <script>

        // Array In Js


        let arr = [1,2,3,4,5]
        console.log(arr);
        console.log(arr.push(100));
        console.log(arr);
        console.log(arr.pop());
        console.log(arr);
        console.log(arr.shift());
        console.log(arr);
        console.log(arr.unshift(500));
        console.log(arr);
        // console.log(arr.reverse());
        // console.log(arr.sort());
        // console.log(arr.splice(0,2));
        console.log(arr);
        console.log(arr.slice(0,2));
        console.log(arr);



        
    </script>
