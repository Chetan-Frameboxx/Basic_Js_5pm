<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conditional Statement</title>
  </head>
  <body>
    <h1>Conditional Statement In JS</h1>

    <script>
      // Conditional Statement In JS

      // 1. if statement

      // if condition is true

      // let age = 24;
      // if (age > 18) {
      //     console.log("Your can vote");
      // }

      // 2. if else statement

      //   let age = 15;
      //   if (age > 18) {
      //     console.log("You can vote.");
      //   } else {
      //     console.log("You can't vote.");
      //   }

      // 3. ladder if else statement

      let temp = 55;

      if (temp >= 55) {
        console.log("Bhar nhi niklna , warna jaal jaoge");
      } else if (temp >= 35) {
        console.log("Hot Outside");
      } else if (temp >= 20) {
        console.log("Warm Outside");
      } else {
        console.log("Cold Outside");
      }

      // 4. Nested if else statement

      let user = "Roha";
      let password = "1234";

      if (user == "Rohan") {
        if (password == "12345") {
          console.log(`Login Successful!, Hello ${user}`);
        } else {
          console.log("Incorrect Passoword!");
        }
      } else {
        console.log("User Not Found!");
      }

      // 5. switch Case

      let day = 2;

      switch (day) {
        case 1:
          console.log("Monday");
          break;
        case 2:
          console.log("Tuesday");

          break;
        case 3:
          console.log("Wednessday");

          break;
        case 4:
          console.log("Thursday");

          break;

        default:
          console.log("Chosse a Number Between 1 to 4");

          break;
      }
    </script>
  </body>
</html>
